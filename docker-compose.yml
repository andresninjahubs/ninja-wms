services:
  db:
    image: postgres:16-alpine
    container_name: wms-postgres
    environment:
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
      POSTGRES_DB: wms
    ports:
      - '5432:5432'
    volumes:
      - wms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wms_pgdata:
